# Shared build and test steps. Ubuntu, macOS, and Windows workflows call this.
name: Build and test

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted runner
        required: true
        type: string
      platform:
        description: Ubuntu, macOS, or Windows
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: inputs.platform == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev

      - name: Install dependencies (macOS)
        if: inputs.platform == 'macOS'
        run: brew install ninja openssl@3

      - name: Install dependencies (Windows)
        if: inputs.platform == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-release --overlay-triplets="${{ github.workspace }}/cmake/triplets"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          args=(-S . -B build -DMOQ_PEERING_BUILD_TESTS=ON -DMOQ_PEERING_BUILD_EXAMPLES=ON)
          case "${{ inputs.platform }}" in
            Ubuntu)
              args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
              ;;
            macOS)
              args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
              ;;
            Windows)
              # picotls calls find_package(PkgConfig REQUIRED) before optional brotli.
              # cmake/pkg-config.cmd satisfies that check. Chocolatey's pkgconfiglite
              # package is not used: its feed returns 504 and the install step still exits 0.
              pkg_config=$(cygpath -m "${GITHUB_WORKSPACE}/cmake/pkg-config.cmd")
              args+=(
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
                -DVCPKG_TARGET_TRIPLET=x64-windows-release
                -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/cmake/triplets"
                "-DPKG_CONFIG_EXECUTABLE=${pkg_config}"
              )
              ;;
          esac
          cmake "${args[@]}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.platform }}" == "Windows" ]]; then
            cmake --build build --config Release --parallel
          else
            cmake --build build --parallel
          fi

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.platform }}" == "Windows" ]]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
